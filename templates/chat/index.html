
{% extends "base.html" %}

{% block title %}Chat - AI Study Assistant{% endblock %}

{% block content %}

<div class="chat-page">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <h2>AI Study Assistant</h2>
        </div>

        <nav class="sidebar-nav">

            <a href="#" class="new-chat-button">
                + Nouveau chat
            </a>

            <a href="#">
                Mes cours
            </a>

            <a href="#">
                Quiz
            </a>

        </nav>

        <div class="sidebar-footer">

            <a href="#">
                Déconnexion
            </a>

        </div>

    </aside>

    <!-- CHAT -->
    <main class="chat-main chat-start">

        <div class="chat-header">
            <h1>AI Study Assistant</h1>
        </div>

        <!-- MESSAGES -->
        <div class="chat-messages">

            <!-- Les messages sont ajoutés dynamiquement par chat.js -->

        </div>

        
<!-- INPUT -->
<div class="chat-input-container">

    <textarea
        placeholder="Pose ta question..."
        class="chat-input"
        rows="1"
        autocomplete="off"
    ></textarea>

    <button
        type="button"
        class="send-button"
        aria-label="Envoyer le message"
    >
        ➤
    </button>

</div>
<!-- Bibliothèque Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Nettoyage du HTML pour la sécurité -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<!-- JavaScript du chatbot : toujours après les deux bibliothèques -->
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

{% endblock %}
