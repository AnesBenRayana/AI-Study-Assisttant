{% extends "base.html" %}

{% block title %}Connexion - AI Study Assistant{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <h1>AI Study Assistant</h1>
            <p>Votre assistant personnel pour apprendre et réviser.</p>
        </div>

        <form class="auth-form" action="/chat" method="get">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Entrez votre email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Entrez votre mot de passe"
                    required
                >
            </div>

            <button type="submit" class="primary-button">
                Se connecter
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Vous n'avez pas encore de compte ?
                <a href="#">Créer un compte</a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
